id = "herdr-council"
name = "Council"
version = "0.1.0"
description = "Ask every coding agent in the workspace the same question and read their answers side by side."
min_herdr_version = "0.9.0"
platforms = ["linux", "macos", "windows"]

[[panes]]
id = "council"
title = "Council"
placement = "popup"
width = "80%"
height = "80%"
command = ["bin/council.exe"]

[[actions]]
id = "open"
title = "Ask the council"
contexts = ["workspace"]
command = ["bin/council.exe", "--open"]

[[actions]]
id = "tab"
title = "Open the Council tab"
contexts = ["workspace"]
command = ["bin/council.exe", "--ensure-tab"]

[[actions]]
id = "bind"
title = "Council: set up a shortcut"
contexts = ["global"]
command = ["bin/council.exe", "--bind"]

# Opens a Council tab in every workspace at start, only after `council --auto-tab on`.
[[startup]]
command = ["bin/council.exe", "--startup"]
