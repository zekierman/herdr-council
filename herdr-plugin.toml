id = "herdr-council"
name = "Council"
version = "0.2.0"
description = "Ask every coding agent in the workspace the same question, then let a judge weigh the answers blind."
min_herdr_version = "0.9.0"
platforms = ["linux", "macos", "windows"]

# Install step: download the prebuilt binary for this version (checksum verified), or build it
# with Go if that fails. The binary is bin/council.exe on every platform.
[[build]]
platforms = ["linux", "macos"]
command = ["/bin/sh", "scripts/fetch-or-build.sh"]

[[build]]
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/fetch-or-build.ps1"]

[[panes]]
id = "council"
title = "Council"
placement = "popup"
width = "80%"
height = "80%"
command = ["bin/council.exe"]

[[actions]]
id = "open"
title = "Ask the council"
contexts = ["workspace"]
command = ["bin/council.exe", "--open"]

[[actions]]
id = "tab"
title = "Open the Council tab"
contexts = ["workspace"]
command = ["bin/council.exe", "--ensure-tab"]

[[actions]]
id = "bind"
title = "Council: set up a shortcut"
contexts = ["global"]
command = ["bin/council.exe", "--bind"]

# Keep a Council tab in every workspace (on by default; turn it off in Council's ⚙ settings).
# Each hook is idempotent: an existing Council tab is left alone, so two never stack up. A tab the
# user closes stays closed until the next herdr start. On Windows the hooks run a GUI-subsystem
# build (council-hook.exe) so no console window flashes on every tab switch.
[[startup]]
platforms = ["linux", "macos"]
command = ["bin/council.exe", "--startup"]

[[startup]]
platforms = ["windows"]
command = ["bin/council-hook.exe", "--startup"]

[[events]]
on = "workspace.created"
platforms = ["linux", "macos"]
command = ["bin/council.exe", "--event"]

[[events]]
on = "workspace.created"
platforms = ["windows"]
command = ["bin/council-hook.exe", "--event"]

[[events]]
on = "tab.focused"
platforms = ["linux", "macos"]
command = ["bin/council.exe", "--event"]

[[events]]
on = "tab.focused"
platforms = ["windows"]
command = ["bin/council-hook.exe", "--event"]

[[events]]
on = "pane.closed"
platforms = ["linux", "macos"]
command = ["bin/council.exe", "--event"]

[[events]]
on = "pane.closed"
platforms = ["windows"]
command = ["bin/council-hook.exe", "--event"]
